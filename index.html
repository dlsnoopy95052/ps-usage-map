<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process Usage Map</title>
<style>
  :root { --bg:#111418; --panel:#1a1f26; --fg:#e6e9ee; --muted:#8b95a3; --line:#2a313b; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:14px 20px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:14px; margin:0 6px 0 0; font-weight:600; }
  .ctl { display:flex; align-items:center; gap:6px; color:var(--muted); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { background:transparent; color:var(--fg); border:0; padding:5px 10px; cursor:pointer; font:inherit; border-right:1px solid var(--line); }
  .seg button:last-child { border-right:0; }
  .seg button.on { background:#3b6fd4; }
  .seg button:hover:not(.on) { background:#252c36; }
  select, input[type=text] { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; }
  #sys { margin-left:auto; color:var(--muted); font-size:12px; text-align:right; }
  main { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  #tip { position:fixed; pointer-events:none; background:rgba(10,12,15,.95); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:12px; line-height:1.5; display:none; z-index:5; max-width:360px; }
  #tip b { font-size:13px; }
  #tip .k { color:var(--muted); display:inline-block; width:78px; }
  footer { display:flex; gap:10px; align-items:center; padding:6px 16px; background:var(--panel); border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
  #ramp { width:220px; height:10px; border-radius:3px; }
</style>
</head>
<body>
<header>
  <h1>Process Usage Map</h1>
  <div class="ctl">Size <div class="seg" id="sizeSeg"></div></div>
  <div class="ctl">Color <select id="colorSel"></select></div>
  <div class="ctl">Group <div class="seg" id="groupSeg">
    <button data-v="app" class="on">App</button><button data-v="none">None</button></div></div>
  <div class="ctl"><input type="text" id="filter" placeholder="Filter name…"></div>
  <button id="pauseBtn" class="seg" style="padding:5px 12px;background:transparent;color:var(--fg);cursor:pointer;font:inherit" title="Space">⏸ Pause</button>
  <div id="sys"></div>
</header>
<main><canvas id="cv"></canvas></main>
<footer>
  <span id="lo">low</span><canvas id="ramp"></canvas><span id="hi">high</span>
  <span style="margin-left:auto" id="count"></span>
</footer>
<div id="tip"></div>

<script>
const fmtBytes = v => v >= 2**30 ? (v/2**30).toFixed(2)+' GB' : v >= 2**20 ? (v/2**20).toFixed(1)+' MB' : (v/1024).toFixed(0)+' KB';
const fmtRate = v => v >= 2**20 ? (v/2**20).toFixed(1)+' MB/s' : v >= 1024 ? (v/1024).toFixed(1)+' KB/s' : v.toFixed(0)+' B/s';
const METRICS = {
  cpu:     { label:'CPU',      fmt:v => v.toFixed(1)+'%' },
  mem:     { label:'Memory',   fmt:fmtBytes },
  power:   { label:'Energy',   fmt:v => v.toFixed(1) },
  threads: { label:'Threads',  fmt:v => v.toFixed(0) },
  ports:   { label:'Mach Ports', fmt:v => v.toFixed(0) },
  sockets: { label:'Sockets',  fmt:v => v.toFixed(0) },
  net_in:  { label:'Net In',   fmt:fmtRate },
  net_out: { label:'Net Out',  fmt:fmtRate },
  disk_read:  { label:'Disk Read',  fmt:fmtRate },
  disk_write: { label:'Disk Write', fmt:fmtRate },
};
const state = { paused:false, size:'mem', color:'cpu', group:'app', filter:'', data:null, rects:[] };

// Heat ramp (inferno-like, dark → bright). t in [0,1].
const STOPS = [[0,[28,32,60]],[.25,[87,36,112]],[.5,[178,55,90]],[.75,[243,121,40]],[1,[252,226,110]]];
function heat(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < STOPS.length; i++) {
    if (t <= STOPS[i][0]) {
      const [t0,c0] = STOPS[i-1], [t1,c1] = STOPS[i], f = (t-t0)/(t1-t0);
      return c0.map((c,j) => Math.round(c + (c1[j]-c)*f));
    }
  }
  return STOPS[STOPS.length-1][1];
}
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const lum = c => (0.299*c[0] + 0.587*c[1] + 0.114*c[2]);

// ---- controls ----
const sizeSeg = document.getElementById('sizeSeg');
for (const [k,m] of Object.entries(METRICS)) {
  const b = document.createElement('button'); b.textContent = m.label; b.dataset.v = k;
  if (k === state.size) b.className = 'on';
  sizeSeg.appendChild(b);
}
sizeSeg.onclick = e => { if (e.target.dataset.v) { state.size = e.target.dataset.v;
  [...sizeSeg.children].forEach(b => b.classList.toggle('on', b === e.target)); draw(); } };
const colorSel = document.getElementById('colorSel');
colorSel.innerHTML = '<option value="same">Same as size</option>' +
  Object.entries(METRICS).map(([k,m]) => `<option value="${k}">${m.label}</option>`).join('');
colorSel.value = state.color;
colorSel.onchange = () => { state.color = colorSel.value; draw(); };
document.getElementById('groupSeg').onclick = e => { if (e.target.dataset.v) { state.group = e.target.dataset.v;
  [...e.currentTarget.children].forEach(b => b.classList.toggle('on', b === e.target)); draw(); } };
document.getElementById('filter').oninput = e => { state.filter = e.target.value.toLowerCase(); draw(); };

// ---- squarified treemap ----
function squarify(items, x, y, w, h) {
  // items: [{value, ...}] sorted desc; writes .x .y .w .h
  const total = items.reduce((s,i) => s + i.value, 0);
  if (!items.length || total <= 0 || w <= 0 || h <= 0) return;
  const scale = (w*h) / total;
  let rest = items.slice(), cx = x, cy = y, cw = w, ch = h;
  const worst = (row, side) => {
    const s = row.reduce((a,i) => a + i.value*scale, 0);
    let mx = 0, mn = Infinity;
    for (const i of row) { const a = i.value*scale; mx = Math.max(mx,a); mn = Math.min(mn,a); }
    return Math.max(side*side*mx/(s*s), s*s/(side*side*mn));
  };
  while (rest.length) {
    const side = Math.min(cw, ch);
    let row = [rest[0]], k = 1;
    while (k < rest.length && worst([...row, rest[k]], side) <= worst(row, side)) row.push(rest[k++]);
    rest = rest.slice(row.length);
    const area = row.reduce((a,i) => a + i.value*scale, 0);
    if (cw >= ch) { // column on the left
      const rw = area/ch; let yy = cy;
      for (const i of row) { const hh = i.value*scale/rw; i.x=cx; i.y=yy; i.w=rw; i.h=hh; yy += hh; }
      cx += rw; cw -= rw;
    } else {
      const rh = area/cw; let xx = cx;
      for (const i of row) { const ww = i.value*scale/rh; i.x=xx; i.y=cy; i.w=ww; i.h=rh; xx += ww; }
      cy += rh; ch -= rh;
    }
  }
}

function buildTree() {
  const sk = state.size, ck = state.color === 'same' ? state.size : state.color;
  let procs = state.data.processes.filter(p => p[sk] > 0 &&
    (!state.filter || (p.name+' '+p.app).toLowerCase().includes(state.filter)));
  procs.forEach(p => p.value = p[sk]);
  let nodes;
  if (state.group === 'app') {
    const g = new Map();
    for (const p of procs) {
      if (!g.has(p.app)) g.set(p.app, { name:p.app, children:[], value:0, isGroup:true });
      const n = g.get(p.app); n.children.push(p); n.value += p.value;
    }
    nodes = [...g.values()];
    // single-process groups render as plain leaves
    nodes = nodes.map(n => n.children.length === 1 ? n.children[0] : n);
  } else nodes = procs;
  nodes.sort((a,b) => b.value - a.value);
  return { nodes, sk, ck };
}

function draw() {
  if (!state.data) return;
  const cv = document.getElementById('cv'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,W,H);
  const { nodes, sk, ck } = buildTree();
  // color normalization: sqrt of value / max, so mid-range processes stay distinguishable
  const all = state.data.processes.map(p => p[ck]);
  const maxC = Math.max(1e-9, ...all);
  const colorOf = p => heat(Math.sqrt(p[ck] / maxC));
  document.getElementById('lo').textContent = '0';
  document.getElementById('hi').textContent = METRICS[ck].fmt(maxC) + ' (' + METRICS[ck].label + ')';

  squarify(nodes, 0, 0, W, H);
  state.rects = [];
  const label = (p, x, y, w, h, c) => {
    if (w < 46 || h < 18) return;
    ctx.fillStyle = lum(c) > 140 ? '#101216' : '#f2f4f7';
    ctx.font = '12px -apple-system, sans-serif';
    ctx.textBaseline = 'top';
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.fillText(p.name, x+5, y+4);
    if (h > 34) { ctx.globalAlpha = .75; ctx.font = '11px -apple-system, sans-serif';
      ctx.fillText(METRICS[sk].fmt(p[sk]), x+5, y+19); }
    ctx.restore();
  };
  const leaf = (p, x, y, w, h) => {
    const c = colorOf(p);
    ctx.fillStyle = rgb(c); ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#111418'; ctx.lineWidth = 1; ctx.strokeRect(x+.5, y+.5, w-1, h-1);
    label(p, x, y, w, h, c);
    state.rects.push({ x, y, w, h, p });
  };
  for (const n of nodes) {
    if (!n.isGroup) { leaf(n, n.x, n.y, n.w, n.h); continue; }
    // group frame with header
    ctx.fillStyle = '#20262f'; ctx.fillRect(n.x, n.y, n.w, n.h);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.strokeRect(n.x+.5, n.y+.5, n.w-1, n.h-1);
    const hdr = n.h > 40 && n.w > 60 ? 18 : 0, pad = 2;
    if (hdr) {
      ctx.fillStyle = '#c9d0da'; ctx.font = 'bold 11px -apple-system, sans-serif'; ctx.textBaseline = 'top';
      ctx.save(); ctx.beginPath(); ctx.rect(n.x, n.y, n.w, hdr); ctx.clip();
      ctx.fillText(`${n.name} · ${METRICS[sk].fmt(n.value)} · ${n.children.length}`, n.x+5, n.y+4);
      ctx.restore();
    }
    n.children.sort((a,b) => b.value - a.value);
    squarify(n.children, n.x+pad, n.y+hdr+pad, n.w-2*pad, n.h-hdr-2*pad);
    for (const c of n.children) leaf(c, c.x, c.y, c.w, c.h);
  }
  document.getElementById('count').textContent =
    `${state.paused ? '⏸ PAUSED · ' : ''}${state.data.processes.length} processes · updated ${new Date(state.data.time*1000).toLocaleTimeString()}`;
  const s = state.data.system;
  document.getElementById('sys').innerHTML = [s['CPU usage'] && 'CPU: '+s['CPU usage'], s['PhysMem'] && 'Mem: '+s['PhysMem']]
    .filter(Boolean).join('<br>');
}

// ---- tooltip ----
const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function sockHtml(p) {
  if (!p.sockets) return '';
  const list = (title, arr, max) => !arr.length ? '' :
    `<br><span class="k">${title}</span>${arr.length}` +
    arr.slice(0, max).map(x => `<br>&nbsp;&nbsp;<span style="color:#b9c2cf">${esc(x)}</span>`).join('') +
    (arr.length > max ? `<br>&nbsp;&nbsp;… +${arr.length - max} more` : '');
  return list('Listening', p.listen, 8) + list('Connections', p.conns, 8);
}

const tip = document.getElementById('tip');
document.getElementById('cv').addEventListener('mousemove', e => {
  const r = e.currentTarget.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = state.rects.find(q => x >= q.x && x < q.x+q.w && y >= q.y && y < q.y+q.h);
  if (!hit) { tip.style.display = 'none'; return; }
  const p = hit.p;
  tip.innerHTML = `<b>${p.name}</b><br>` +
    `<span class="k">PID</span>${p.pid}<br><span class="k">User</span>${p.user}<br><span class="k">State</span>${p.state}<br>` +
    Object.entries(METRICS).map(([k,m]) => `<span class="k">${m.label}</span>${m.fmt(p[k])}`).join('<br>') +
    (p.app !== p.name ? `<br><span class="k">App</span>${p.app}` : '') +
    sockHtml(p) +
    (p.path ? `<br><span class="k">Path</span><span style="word-break:break-all">${p.path}</span>` : '');
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 380) + 'px';
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + 'px';
});
document.getElementById('cv').addEventListener('mouseleave', () => tip.style.display = 'none');

// ---- legend ramp ----
(function() {
  const c = document.getElementById('ramp'); c.width = 220; c.height = 10;
  const g = c.getContext('2d');
  for (let i = 0; i < 220; i++) { g.fillStyle = rgb(heat(i/219)); g.fillRect(i, 0, 1, 10); }
})();

// ---- pause ----
const pauseBtn = document.getElementById('pauseBtn');
function setPaused(v) {
  state.paused = v;
  pauseBtn.textContent = v ? '▶ Resume' : '⏸ Pause';
  pauseBtn.style.background = v ? '#b8860b' : 'transparent';
  if (!v) poll();
  draw();
}
pauseBtn.onclick = () => setPaused(!state.paused);
addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|SELECT/.test(e.target.tagName)) { e.preventDefault(); setPaused(!state.paused); }
});

// ---- polling ----
async function poll() {
  if (state.paused) return;
  try {
    const r = await fetch('/api/processes'); const d = await r.json();
    if (d.processes.length && !state.paused) { state.data = d; draw(); }
  } catch (e) {}
}
addEventListener('resize', draw);
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
